name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DATABASE_URL: mongodb://localhost:27017/pixl-ci

jobs:
  build:
    name: Build frontend and backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/web/package-lock.json
            backend/rest_server/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend/rest_server
        run: npm ci

      - name: Build frontend
        working-directory: frontend/web
        run: npm run build

      - name: Stage frontend build
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build/frontend"
          cp -R frontend/web/.output/. "${GITHUB_WORKSPACE}/build/frontend/"
          test -f "${GITHUB_WORKSPACE}/build/frontend/server/index.mjs"

      - name: Stage backend build
        working-directory: backend/rest_server
        run: |
          chmod +x scripts/stage-build.sh
          BUILD_DIR="${GITHUB_WORKSPACE}/build/backend" bash scripts/stage-build.sh

      - name: Verify build folders
        run: |
          ls -la build/
          ls -la build/frontend/server | head -5
          ls -la build/backend | head -20
          test -f build/backend/index.js
          test -d build/backend/node_modules/@prisma/client

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixl-build
          path: build/
          if-no-files-found: error
