# =============================================================================
# Local-only Mongo + MinIO (legacy). Prefer the root docker-compose.yml for EC2.
# Generate nothing here for production — use ../docker-compose.yml instead.
# =============================================================================
services:
  minio:
    image: minio/minio:latest
    profiles: ["legacy-local"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_vol:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  minio_vol:
