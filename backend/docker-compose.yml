services:
 # mongodb replicaset primary
  mongod1:
    container_name: mongod1
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - backend_mongo_net
    ports:
      - 27017:27017
    volumes:
      - /mnt/extra/docker_volume/mongo_vol1:/data/db
      - /home/anya/Documents/code/pixl/backend/replica.key:/data/replica.key
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh
    restart: unless-stopped
    command: "mongod --replSet dbrs --keyFile /data/replica.key; bash /docker-entrypoint-initdb.d/init-mongo.sh;"

  # mongodb replicaset secondary
  mongod2:
    container_name: mongod2
    image: mongo:latest
    networks:
      - backend_mongo_net
    ports:
      - 27018:27017
    volumes:
      - /mnt/extra/docker_volume/mongo_vol2:/data/db
      - /home/anya/Documents/code/pixl/backend/replica.key:/data/replica.key
    restart: unless-stopped
    command: "mongod --replSet dbrs --keyFile /data/replica.key"

  # mongodb replicaset arbiter
  mongod3:
    container_name: mongod3
    image: mongo:latest
    networks:
      - backend_mongo_net
    ports:
      - 27019:27017
    volumes:
      - /mnt/extra/docker_volume/mongo_vol3:/data/db
      - /home/anya/Documents/code/pixl/backend/replica.key:/data/replica.key
    restart: unless-stopped
    command: "mongod --replSet dbrs --keyFile /data/replica.key"

networks:
  backend_mongo_net: 
    driver: bridge