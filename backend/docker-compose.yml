services:
  mongod1:
    container_name: mongod1
    image: mongo:latest
    ports:
      - 27017:27017
    volumes:
      - /mnt/extra/docker_volume/mongo_vol1:/data/db
      - /home/anya/Documents/code/pixl/backend/replica.key:/data/replica.key
      - /home/anya/Documents/code/pixl/backend//entrypoint.sh:/docker-entrypoint-initdb.d/entrypoint.sh
    networks:
      - backend_mongo_net
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminadmin1
    command: mongod --replSet dbrs --keyFile /data/replica.key --bind_ip_all --auth
    restart: unless-stopped
    
  mongod2:
    container_name: mongod2
    image: mongo:latest
    ports:
      - 27018:27017
    volumes:
      - /mnt/extra/docker_volume/mongo_vol2:/data/db
      - /home/anya/Documents/code/pixl/backend/replica.key:/data/replica.key
    networks:
      - backend_mongo_net
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminadmin1
    command: mongod --replSet dbrs --keyFile /data/replica.key --bind_ip_all --auth
    restart: unless-stopped

  mongod3:
    container_name: mongod3
    image: mongo:latest
    ports:
      - 27019:27017
    volumes:
      - /mnt/extra/docker_volume/mongo_vol3:/data/db
      - /home/anya/Documents/code/pixl/backend/replica.key:/data/replica.key
    networks:
      - backend_mongo_net
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminadmin1
    command: mongod --replSet dbrs --keyFile /data/replica.key --bind_ip_all --auth
    restart: unless-stopped
  
  mongod4:
    container_name: mongod4
    image: mongo:latest
    ports:
      - 27020:27017
    volumes:
      - /mnt/extra/docker_volume/mongo_vol4:/data/db
      - /home/anya/Documents/code/pixl/backend/replica.key:/data/replica.key
    networks:
      - backend_mongo_net
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminadmin1
    command: mongod --replSet dbrs --keyFile /data/replica.key --bind_ip_all --auth
    restart: unless-stopped

  mongo-init-replica:
    image: mongo:latest
    depends_on:
      - mongod1
      - mongod2
      - mongod3
      - mongod4
    volumes:
      - ./checkprimary.sh:/checkprimary.sh
      - /home/anya/Documents/code/pixl/backend/replica.key:/data/replica.key
    entrypoint: ["/checkprimary.sh"]
    networks:
      - backend_mongo_net
    restart: unless-stopped

networks:
  backend_mongo_net:
    driver: bridge
