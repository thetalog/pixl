listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
fingerprint
use-auth-secret
static-auth-secret=TURN_SECRET_PLACEHOLDER
realm=pixl.local
total-quota=100
stale-nonce=600
no-multicast-peers
no-cli
no-tls
no-dtls
