# Pixl production stack for a single AWS EC2 host.
#
# MongoDB: ONE replica-set member (satisfies Prisma $transaction).
# Media: AWS S3 (not MinIO).
#
# Usage:
#   cp .env.example .env
#   # edit secrets / DOMAIN / AWS credentials
#   docker compose up -d --build

name: pixl

services:
  mongo:
    image: mongo:7.0
    container_name: pixl-mongo
    restart: unless-stopped
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_APP_DB: ${MONGO_APP_DB:-pixl}
      REPLICA_SET_NAME: ${REPLICA_SET_NAME:-rs0}
      MONGO_HOST_FOR_RS: mongo:27017
      WIREDTIGER_CACHE_GB: "0.5"
    volumes:
      - mongo_data:/data/db
      - ./deploy/mongo/docker-entrypoint-rs.sh:/docker-entrypoint-rs.sh:ro
    entrypoint: ["/bin/bash", "/docker-entrypoint-rs.sh"]
    networks:
      - pixl_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh -u \"$$MONGO_ROOT_USERNAME\" -p \"$$MONGO_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1",
        ]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 60s
    expose:
      - "27017"
    mem_limit: 768m

  backend:
    build:
      context: ./backend/rest_server
      dockerfile: Dockerfile
    container_name: pixl-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_BUCKET_POSTS: ${S3_BUCKET_POSTS}
      S3_BUCKET_DM: ${S3_BUCKET_DM}
      S3_BUCKET_GROUP_MSG: ${S3_BUCKET_GROUP_MSG}
      S3_BUCKET_GROUP_DP: ${S3_BUCKET_GROUP_DP}
      S3_BUCKET_PROFILE: ${S3_BUCKET_PROFILE}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      FRONTEND_URL: ${FRONTEND_URL}
    networks:
      - pixl_internal
    expose:
      - "3001"
    mem_limit: 768m

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        API_BASE: ${API_BASE}
        LIVE_WS_BASE: ${LIVE_WS_BASE:-ws://localhost:9090}
    container_name: pixl-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3000"
      NUXT_PUBLIC_API_BASE: ${API_BASE}
      NUXT_PUBLIC_LIVE_WS_BASE: ${LIVE_WS_BASE:-ws://localhost:9090}
    networks:
      - pixl_internal
    expose:
      - "3000"
    mem_limit: 512m

  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    container_name: pixl-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - pixl_internal
    mem_limit: 128m

networks:
  pixl_internal:
    driver: bridge

volumes:
  mongo_data:
