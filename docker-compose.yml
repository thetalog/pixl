# Pixl production stack for a single AWS EC2 host.
#
# MongoDB: ONE replica-set member (satisfies Prisma $transaction).
# Multiple Mongo containers on the SAME EC2 do NOT provide EC2-level HA —
# if the instance dies, all members die. Use Atlas for real HA later.
#
# Usage:
#   cp .env.example .env
#   # edit secrets / DOMAIN
#   docker compose up -d --build

name: pixl

services:
  mongo:
    image: mongo:7.0
    container_name: pixl-mongo
    restart: unless-stopped
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_APP_DB: ${MONGO_APP_DB:-pixl}
      REPLICA_SET_NAME: ${REPLICA_SET_NAME:-rs0}
      MONGO_HOST_FOR_RS: mongo:27017
      WIREDTIGER_CACHE_GB: "0.5"
    volumes:
      - mongo_data:/data/db
      - ./deploy/mongo/docker-entrypoint-rs.sh:/docker-entrypoint-rs.sh:ro
    entrypoint: ["/bin/bash", "/docker-entrypoint-rs.sh"]
    networks:
      - pixl_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh -u \"$$MONGO_ROOT_USERNAME\" -p \"$$MONGO_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1",
        ]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 60s
    # Not published to the host — Docker network only
    expose:
      - "27017"
    mem_limit: 768m

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: pixl-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - pixl_internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    expose:
      - "9000"
      - "9001"
    mem_limit: 512m

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: pixl-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_POSTS_BUCKET: ${MINIO_POSTS_BUCKET:-pixl}
      MINIO_CONVERSATION_DIRECT_MESSAGE_BUCKET: ${MINIO_CONVERSATION_DIRECT_MESSAGE_BUCKET:-conversation-direct-messages}
      MINIO_CONVERSATION_GROUP_MESSAGE_BUCKET: ${MINIO_CONVERSATION_GROUP_MESSAGE_BUCKET:-conversation-group-messages}
      MINIO_CONVERSATION_GROUP_DP_BUCKET: ${MINIO_CONVERSATION_GROUP_DP_BUCKET:-conversation-group-dp}
      MINIO_PROFILE_BUCKET: ${MINIO_PROFILE_BUCKET:-pixl-profile}
    volumes:
      - ./deploy/minio/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: ["/bin/sh", "/create-buckets.sh"]
    networks:
      - pixl_internal
    restart: "no"

  backend:
    build:
      context: ./backend/rest_server
      dockerfile: Dockerfile
    container_name: pixl-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Stored in DB; browser rewrites hostname "minio" via API /storage proxy
      MINIO_PUBLIC_URL: http://minio:9000
      MINIO_POSTS_BUCKET: ${MINIO_POSTS_BUCKET:-pixl}
      MINIO_CONVERSATION_DIRECT_MESSAGE_BUCKET: ${MINIO_CONVERSATION_DIRECT_MESSAGE_BUCKET:-conversation-direct-messages}
      MINIO_CONVERSATION_GROUP_MESSAGE_BUCKET: ${MINIO_CONVERSATION_GROUP_MESSAGE_BUCKET:-conversation-group-messages}
      MINIO_CONVERSATION_GROUP_DP_BUCKET: ${MINIO_CONVERSATION_GROUP_DP_BUCKET:-conversation-group-dp}
      MINIO_PROFILE_BUCKET: ${MINIO_PROFILE_BUCKET:-pixl-profile}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      FRONTEND_URL: ${FRONTEND_URL}
    networks:
      - pixl_internal
    expose:
      - "3001"
    mem_limit: 768m

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        API_BASE: ${API_BASE}
        LIVE_WS_BASE: ${LIVE_WS_BASE:-ws://localhost:9090}
    container_name: pixl-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3000"
      NUXT_PUBLIC_API_BASE: ${API_BASE}
      NUXT_PUBLIC_LIVE_WS_BASE: ${LIVE_WS_BASE:-ws://localhost:9090}
    networks:
      - pixl_internal
    expose:
      - "3000"
    mem_limit: 512m

  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    container_name: pixl-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - pixl_internal
    mem_limit: 128m

networks:
  pixl_internal:
    driver: bridge

volumes:
  mongo_data:
  minio_data:
