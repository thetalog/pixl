name: pixl
description: RTMP test
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  permission_handler: ^12.0.1
  wakelock_plus: ^1.4.0
  path_provider: ^2.1.5
  video_player: ^2.10.1
  flutter_vlc_player: ^7.4.3
  collection: ^1.19.1
  intl: ^0.20.2
  http: ^1.3.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^10.0.0
  toast: ^0.3.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.2.3
  app_links: ^7.0.0
  flutter_riverpod: 2.6.0
  image_picker: ^1.0.7
  logger: ^2.6.2
  video_thumbnail: ^0.5.6
  file_picker: ^10.3.10
  dio: ^5.9.1
  flutter_cache_manager: ^3.3.1
  widgets_to_image: ^2.0.0
  photo_manager: ^3.0.0
  cached_network_image: ^3.4.1
  image: ^4.7.2
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  firebase_analytics: ^12.1.1
  livekit_client: ^2.6.2
  web_socket_channel: ^3.0.3
  flutter_webrtc: ^1.3.0
  socket_io_client: ^3.1.4
flutter:
  assets:
    - assets/icons/HeartUnliked.png
    - assets/icons/HeartLiked.png
    - assets/images/fallback.png
    - .env
  uses-material-design: true
  fonts:
    - family: Lekerli-one
      fonts:
        - asset: assets/fonts/LeckerliOne-Regular.ttf
    - family: Lunasima-Bold
      fonts:
        - asset: assets/fonts/lunasima/Lunasima-Bold.ttf
    - family: Lunasima-Regular
      fonts:
        - asset: assets/fonts/lunasima/Lunasima-Regular.ttf